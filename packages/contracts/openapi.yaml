openapi: 3.1.0
info:
  title: Petroglyph API
  version: 0.0.0
  description: "Generated from packages/contracts. Do not edit the YAML by hand: change the operation registry instead."
paths:
  /auth/callback:
    get:
      operationId: getAuthCallback
      summary: Complete the GitHub authorisation flow
      tags:
        - auth
  /auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Refresh the access token
      tags:
        - auth
  /auth/url:
    get:
      operationId: getAuthUrl
      summary: Start the GitHub authorisation flow
      tags:
        - auth
  /files:
    get:
      operationId: listFiles
      summary: List the delivered files for the active profile
      tags:
        - files
  /files/changes:
    get:
      operationId: getFilesChanges
      summary: List files changed since a cursor
      tags:
        - files
      deprecated: true
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            default: 25
            type: integer
            exclusiveMinimum: 0
            maximum: 100
  /files/{itemId}:
    get:
      operationId: getFile
      summary: Read one delivered file
      tags:
        - files
  /health:
    get:
      operationId: getHealth
      summary: Report service health
      tags:
        - health
  /onedrive/auth-url:
    get:
      operationId: getOnedriveAuthUrl
      summary: Start the OneDrive authorisation flow
      tags:
        - onedrive
  /onedrive/connect:
    get:
      operationId: bridgeOnedriveCallback
      summary: Bridge the OneDrive OAuth callback into the app
      tags:
        - onedrive
    post:
      operationId: connectOnedrive
      summary: Connect an OneDrive account
      tags:
        - onedrive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 1
                state:
                  type: string
                  minLength: 1
              required:
                - code
                - state
  /onedrive/lifecycle:
    post:
      operationId: postOnedriveLifecycle
      summary: Receive OneDrive lifecycle notifications
      tags:
        - onedrive
  /onedrive/sync-trigger:
    post:
      operationId: postOnedriveSyncTrigger
      summary: Enqueue a OneDrive delta walk for the caller's connection (Sync Now)
      tags:
        - onedrive
  /profiles:
    get:
      operationId: listProfiles
      summary: List sync profiles
      tags:
        - profiles
    post:
      operationId: createProfile
      summary: Create a sync profile
      tags:
        - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                sourceFolderPath:
                  type: string
                  minLength: 1
                destinationVaultPath:
                  type: string
                  minLength: 1
                pollingIntervalMinutes:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                enabled:
                  type: boolean
              required:
                - name
                - sourceFolderPath
                - destinationVaultPath
  /profiles/{id}:
    get:
      operationId: getProfile
      summary: Read one sync profile
      tags:
        - profiles
    put:
      operationId: putProfile
      summary: Replace one sync profile
      tags:
        - profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                sourceFolderPath:
                  type: string
                  minLength: 1
                destinationVaultPath:
                  type: string
                  minLength: 1
                pollingIntervalMinutes:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
                enabled:
                  type: boolean
                initialSyncEnabled:
                  type: boolean
                active:
                  type: boolean
              additionalProperties: false
    delete:
      operationId: deleteProfile
      summary: Delete one sync profile
      tags:
        - profiles
  /status:
    get:
      operationId: getStatus
      summary: Report the user's sync status
      tags:
        - status
  /sync/jobs/{jobId}:
    get:
      operationId: getSyncJob
      summary: Read one sync job
      tags:
        - sync
      deprecated: true
  /sync/reset:
    post:
      operationId: resetSync
      summary: Reset the user's sync state
      tags:
        - sync
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum:
                    - server
                    - full
              required:
                - scope
  /sync/run:
    post:
      operationId: runSync
      summary: Run a sync now
      tags:
        - sync
      deprecated: true
